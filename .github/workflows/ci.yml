name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile alerts.py tests/test_alerts.py
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from alerts import evaluate, validate_rules
          e={"id":"e1","kind":"flood","title":"Flood","severity":0.9,"confidence":0.8,"official":False,"area":"Madrid","source":{"name":"test"}}
          r=validate_rules([{"id":"r1","kinds":["flood"],"min_severity":0.7,"min_confidence":0.7,"area_contains":["Madrid"]}])
          out=evaluate(e,r)
          assert len(out)==1
          assert out[0]['rule_id']=='r1'
          PY
